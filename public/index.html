<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Qwirkle">
<meta name="theme-color" content="#15171c">
<title>Qwirkle Scorekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="bg-photo" aria-hidden="true"></div>
<div class="bg-scrim" aria-hidden="true"></div>

<div id="app"></div>

<!-- End game modal -->
<div id="endModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-eyebrow">End game</div>
      <h2>Who played their last tile?</h2>
    </div>
    <div class="modal-sub">That player gets the +6 final-tile bonus. Pick "No one" if the bag ran out and nobody emptied their hand.</div>
    <div id="endPlayerList" class="end-player-list"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="endCancel">Cancel</button>
      <button class="btn primary" id="endNoBonus">No one — end without bonus</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/app.js"></script>
</body>
</html>
