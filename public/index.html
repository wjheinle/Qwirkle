<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Qwirkle">
<meta name="theme-color" content="#15171c">
<title>Qwirkle Scorekeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<svg class="bg-tiles" id="bgTiles" viewBox="0 0 100 200" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <symbol id="shp-circle" viewBox="-12 -12 24 24"><circle r="10"/></symbol>
    <symbol id="shp-square" viewBox="-12 -12 24 24"><rect x="-9" y="-9" width="18" height="18" rx="2.5"/></symbol>
    <symbol id="shp-diamond" viewBox="-12 -12 24 24"><rect x="-7.5" y="-7.5" width="15" height="15" rx="2" transform="rotate(45)"/></symbol>
    <symbol id="shp-clover" viewBox="-12 -12 24 24">
      <circle cx="0" cy="-5.5" r="6"/><circle cx="0" cy="5.5" r="6"/><circle cx="-5.5" cy="0" r="6"/><circle cx="5.5" cy="0" r="6"/>
    </symbol>
    <symbol id="shp-star" viewBox="-12 -12 24 24">
      <path d="M0,-11 L2.7,-3.7 L10.5,-3.4 L4.2,1.7 L6.5,9.4 L0,4.7 L-6.5,9.4 L-4.2,1.7 L-10.5,-3.4 L-2.7,-3.7 Z"/>
    </symbol>
    <symbol id="shp-x" viewBox="-12 -12 24 24">
      <g stroke-linecap="round">
        <rect x="-9" y="-2.6" width="18" height="5.2" rx="2.6" transform="rotate(45)"/>
        <rect x="-9" y="-2.6" width="18" height="5.2" rx="2.6" transform="rotate(-45)"/>
      </g>
    </symbol>
  </defs>
  <g id="bgTilesGroup"></g>
</svg>

<div id="app"></div>

<!-- Score entry modal -->
<div id="entryModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-eyebrow">Score this turn</div>
      <h2 id="entryPlayerName">—</h2>
    </div>
    <input id="entryPoints" type="number" inputmode="numeric" min="0" step="1" placeholder="0" autocomplete="off">
    <label class="toggle-row">
      <span>Qwirkle (completed a line of 6)</span>
      <input type="checkbox" id="entryQwirkle">
      <span class="toggle-pill" data-for="entryQwirkle"></span>
    </label>
    <div class="modal-actions">
      <button class="btn ghost" id="entryCancel">Cancel</button>
      <button class="btn primary" id="entrySubmit">Add score</button>
    </div>
  </div>
</div>

<!-- End game modal -->
<div id="endModal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-eyebrow">End game</div>
      <h2>Who played their last tile?</h2>
    </div>
    <div class="modal-sub">That player gets the +6 final-tile bonus. Pick "No one" if the bag ran out and nobody emptied their hand.</div>
    <div id="endPlayerList" class="end-player-list"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="endCancel">Cancel</button>
      <button class="btn primary" id="endNoBonus">No one — end without bonus</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="/app.js"></script>
</body>
</html>
